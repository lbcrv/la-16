name: Actualizar resultados

# Trae los resultados de TheSportsDB y hace commit si hay cambios.
# Cloudflare Pages publica solo cada commit a main.

on:
  schedule:
    # Horas en UTC; Honduras es UTC-6.
    # Cada 30 min de 3 p. m. a 12:30 a. m. de Honduras (modo rápido: solo consulta
    # la API si hay un partido que ya debió terminar y no tiene marcador).
    - cron: "*/30 21-23 * * *"
    - cron: "*/30 0-6 * * *"
    # 8 a. m. de Honduras: revisión completa, incluidos cambios de horario.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Traer resultados de TheSportsDB
        run: node scripts/actualizar.mjs
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
          COMPLETO: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *' }}

      - name: Guardar cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Resultados actualizados desde TheSportsDB"
          git push
